apiVersion: apps/v1
kind: Deployment
metadata:
  name: kapi
  namespace: feature
  labels:
    app: kapi
spec:
  selector:
    matchLabels:
      app: kapi
  template:
    metadata:
      labels:
        app: kapi
    spec:
      nodeSelector:
        kubernetes.io/hostname: klynx-poc-01
      containers:
        - name: kapi
          image: regis.pointit.co.th/infra/go-dev:1.0.0
          command: 
           - "sleep"
          args: 
            - "infinity"
          # command: ["go", "run", ".", "--env=prod"]
          # command: ["./main", "--env=prod"]
          imagePullPolicy: IfNotPresent
          env:
          - name: MASTER_KEYRING_JSON
            valueFrom:
              secretKeyRef:
                name: klynx-masterkey
                key: MASTER_KEYRING_JSON
          # envFrom:
          #   - configMapRef:
          #       name: kapi-config
          #   - secretRef:
          #       name: kapi-secrets
          ports:
            - name: http
              containerPort: 3001
          volumeMounts:
            - name: src-code
              mountPath: /app
            - name: rootca-volume
              mountPath: /app/certs/tls.ca
              subPath: tls.ca
              readOnly: true
            - name: crimes
              mountPath: /app/crimes
              subPath: upload
              # readOnly: true
          securityContext:
            privileged: true
      volumes:
        - name: src-code
          hostPath:
            path: /home/klynx/klynx-api-feature
            type: Directory
        - name: crimes
          hostPath:
            path: /home/klynx/klynx-api-feature/data/crimes
            type: Directory
        - name: rootca-volume
          hostPath:
            path: /home/klynx/klynx-api-feature/certs
            type: Directory
        # - name: rootca-volume
        #   configMap:
        #     name: rootca
        #     items:
        #       - key: ca.crt
        #         path: tls.ca
---
apiVersion: v1
kind: Service
metadata:
  name: kapi
  namespace: feature
spec:
  selector:
    app: kapi
  ports:
    - name: http
      port: 3001
      targetPort: http
      protocol: TCP
  type: ClusterIP
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  generation: 1
  name: grant-kapi-to-istio
  namespace: feature
spec:
  from:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    namespace: istio-system
  to:
  - group: ""
    kind: Service
    name: kapi
