apiVersion: apps/v1
kind: Deployment
metadata:
  name: kapi-uat
  namespace: feature
  labels:
    app: kapi-uat
spec:
  selector:
    matchLabels:
      app: kapi-uat
  template:
    metadata:
      labels:
        app: kapi-uat
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8sserver3
      containers:
        - name: kapi-uat
          image: regis.pointit.co.th/infra/go-dev:1.0.9
          # command: ["sleep"]
          # args: ["infinity"]
          # command: ["go", "run", ".", "--env=prod"]
          # command: ["./main", "--env=prod"]
          imagePullPolicy: IfNotPresent
          # envFrom:
          #   - configMapRef:
          #       name: kapi-uat-config
          #   - secretRef:
          #       name: kapi-uat-secrets
          ports:
            - name: http
              containerPort: 3001
          volumeMounts:
            - name: src-code
              mountPath: /app
            - name: rootca-volume
              mountPath: /app/certs/tls.ca
              subPath: tls.ca
              readOnly: true
            - name: crimes
              mountPath: /app/crimes
              subPath: upload
              # readOnly: true
          securityContext:
            privileged: true
      volumes:
        - name: src-code
          hostPath:
            path: /home/klynx/klynx-api-feature
            type: Directory
        - name: crimes
          persistentVolumeClaim:
            claimName: crimes-nfs-pvc
        - name: rootca-volume
          configMap:
            name: rootca
            items:
              - key: ca.crt
                path: tls.ca
---
apiVersion: v1
kind: Service
metadata:
  name: kapi-uat
  namespace: feature
spec:
  selector:
    app: kapi-uat
  ports:
    - name: http
      port: 3001
      targetPort: http
      protocol: TCP
  type: ClusterIP