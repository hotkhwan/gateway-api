apiVersion: apps/v1
kind: Deployment
metadata:
  name: kapi
  namespace: gw
  labels:
    app: kapi
spec:
  selector:
    matchLabels:
      app: kapi
  template:
    metadata:
      labels:
        app: kapi
    spec:
      nodeSelector:
        kubernetes.io/hostname: gateway
      imagePullSecrets:
        - name: harbor-credential
      containers:
        - name: kapi
          image: regis.pointit.co.th/ata/gateway-api:6c4ca14
          imagePullPolicy: Always
          command: ["./app"]
          ports:
            - name: http
              containerPort: 3001
          volumeMounts:
            - name: rootca-volume
              mountPath: /app/certs/tls.ca
              subPath: tls.ca
              readOnly: true
            - name: env-volume
              mountPath: /app/.env.dev
              subPath: .env.dev
              readOnly: true
      volumes:
        - name: rootca-volume
          hostPath:
            path: /home/aisom/gateway-api/certs
            type: Directory
        - name: env-volume
          secret:
            secretName: kapi-env-secret
---
apiVersion: v1
kind: Service
metadata:
  name: kapi
  namespace: gw
spec:
  selector:
    app: kapi
  ports:
    - name: http
      port: 3001
      targetPort: http
      protocol: TCP
  type: ClusterIP
