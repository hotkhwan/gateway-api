info:
  contact: {}
  description: Event ingestion, normalization, and delivery gateway
  title: phibek API
  version: "1.0"
paths:
  /ata/stream/{channelId}:
    get:
      consumes:
      - application/json
      description: Return WSS FLV URL for given ATA channelId so frontend can play
        FLV over WebSocket.
      parameters:
      - description: ATA channel ID
        in: path
        name: channelId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Stream URL info
          schema:
            $ref: '#/definitions/gmod.SuccessDataResponse'
        "400":
          description: Bad Request - invalid or missing channelId
          schema:
            $ref: '#/definitions/gmod.ApiErrorResponse'
        "500":
          description: Internal Server Error - config or build failed
          schema:
            $ref: '#/definitions/gmod.ApiErrorResponse'
        "502":
          description: Bad Gateway - ATA upstream error
          schema:
            $ref: '#/definitions/gmod.ApiErrorResponse'
      security:
      - BearerAuth: []
      summary: Get ATA FLV WebSocket stream URL
      tags:
      - ATA
  /ata/svms/sync:
    post:
      consumes:
      - application/json
      description: Calls ATA Edge AI API to fetch devices and channels then upsert
        into `camera` collection.
      parameters:
      - description: Optional sync options
        in: body
        name: body
        schema:
          $ref: '#/definitions/atapi.SyncRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Sync result
          schema:
            $ref: '#/definitions/gmod.SuccessDataResponse'
        "500":
          description: Internal Server Error - config or DB error
          schema:
            $ref: '#/definitions/gmod.ApiErrorResponse'
        "502":
          description: Bad Gateway - ATA upstream error
          schema:
            $ref: '#/definitions/gmod.ApiErrorResponse'
      security:
      - BearerAuth: []
      summary: Sync ATA devices & channels from Edge AI to Klynx
      tags:
      - ATA
  /atapi/blacklist/notification:
    get:
      consumes:
      - application/json
      description: List events with pagination. Filter by dateTime/sn/channelId and
        search by camera name(zone/address). No type filter. No isDeleted filter.
      parameters:
      - description: 'Date range: YYYY-MM-DD,YYYY-MM-DD'
        in: query
        name: dateTime
        required: true
        type: string
      - description: Filter by device SN
        in: query
        name: sn
        type: string
      - description: Filter by channelId
        in: query
        name: channelId
        type: integer
      - description: Regex search by camera name (address/zone) OR person name
        in: query
        name: search
        type: string
      - description: Page number
        in: query
        name: page
        type: integer
      - description: Items per page (max 200)
        in: query
        name: perPage
        type: integer
      - description: asc or desc
        in: query
        name: sortOrder
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/aimodel.StandardResponse'
      security:
      - BearerAuth: []
      summary: Notification list (ALL events)
      tags:
      - ATA
  /atapi/blacklist/summary:
    get:
      consumes:
      - application/json
      description: Summary + list events with pagination. Filter by dateTime/sn/channelId/listType
        and search by camera name (address).
      parameters:
      - description: 'Date range: YYYY-MM-DD,YYYY-MM-DD'
        in: query
        name: dateTime
        required: true
        type: string
      - description: Filter by device SN
        in: query
        name: sn
        type: string
      - description: Filter by channelId
        in: query
        name: channelId
        type: integer
      - description: Regex search by camera name (address)
        in: query
        name: search
        type: string
      - description: eventAttribute.listType (omit = all; if provided filters exact
          int, including 0)
        in: query
        name: listType
        type: integer
      - description: 'list name: blacklist|whitelist|redlist|strangers (omit = all).
          If both listType and listName provided, listType wins.'
        in: query
        name: listName
        type: string
      - description: Page number
        in: query
        name: page
        type: integer
      - description: Items per page (max 200)
        in: query
        name: perPage
        type: integer
      - description: asc or desc
        in: query
        name: sortOrder
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/aimodel.BlacklistSummaryResponse'
      security:
      - BearerAuth: []
      summary: Blacklist summary + list
      tags:
      - ATA
  /atapi/peopleCounting/summary:
    get:
      consumes:
      - application/json
      description: Summary (in/out/total) + list events with pagination. Filter by
        camera/dateTime/direction.
      parameters:
      - description: 'Date range: RFC3339,RFC3339 or YYYY-MM-DD,YYYY-MM-DD (if omitted:
          today 00:00:00 (Asia/Bangkok) to now)'
        in: query
        name: dateTime
        type: string
      - description: 'CSV only: camera=cam1,cam2'
        in: query
        name: camera
        type: string
      - description: 'CSV only: direction=in,out'
        in: query
        name: direction
        type: string
      - description: Filter by device SN
        in: query
        name: sn
        type: string
      - description: Filter by channelId
        in: query
        name: channelId
        type: integer
      - description: Regex search by camera name (address) / zone
        in: query
        name: search
        type: string
      - description: Filter by directionCode 1=in 2=out (overrides direction)
        in: query
        name: directionCode
        type: integer
      - description: Page number
        in: query
        name: page
        type: integer
      - description: Items per page (max 200)
        in: query
        name: perPage
        type: integer
      - description: asc or desc
        in: query
        name: sortOrder
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/aimodel.PeopleCountingSummaryResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/gmod.BadRequestResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/gmod.InternalErrorResponse'
      security:
      - BearerAuth: []
      summary: PeopleCounting summary + list
      tags:
      - ATA
  /auth/introspect:
    get:
      consumes:
      - application/json
      description: ตรวจสอบความถูกต้องของ JWT จาก Authorization Header
      parameters:
      - description: Bearer <JWT>
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/gmod.SuccessDetailResponseIntrospect'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/gmod.ApiErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/gmod.ApiErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/gmod.ApiErrorResponse'
      security:
      - BearerAuth: []
      summary: Introspect JWT Token (Local JWKS Verify)
      tags:
      - Auth
  /auth/oauth/callback:
    post:
      consumes:
      - application/json
      parameters:
      - description: OAuth callback payload
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/authmod.OAuthCallbackRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/authmod.SigninResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/gmod.BadRequestResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/gmod.UnauthorizedResponse'
      summary: OAuth callback exchange (authorization_code -> tokens)
      tags:
      - Auth
  /auth/refreshToken:
    post:
      consumes:
      - application/json
      parameters:
      - description: Refresh Token
        in: body
        name: data
        required: true
        schema:
          additionalProperties:
            type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/authmod.SigninResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/gmod.BadRequestResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/gmod.UnauthorizedResponse'
      summary: Refresh Token
      tags:
      - Auth
  /auth/resetPassword:
    post:
      consumes:
      - application/json
      parameters:
      - description: Bearer Token
        in: header
        name: Authorization
        required: true
        type: string
      - description: New Password
        in: body
        name: data
        required: true
        schema:
          additionalProperties:
            type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/authmod.SigninResponseWrapper'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/gmod.BadRequestResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/gmod.UnauthorizedResponse'
      summary: Reset Password
      tags:
      - Auth
  /auth/signin:
    post:
      consumes:
      - application/json
      parameters:
      - description: User credentials
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/authmod.SigninRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/authmod.SigninResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/gmod.BadRequestResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/gmod.UnauthorizedResponse'
      summary: Signin
      tags:
      - Auth
  /auth/signout:
    post:
      parameters:
      - description: Bearer Token
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/authmod.SigninResponseWrapper'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/gmod.BadRequestResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/gmod.UnauthorizedResponse'
      security:
      - BearerAuth: []
      summary: Signout
      tags:
      - Auth
  /bi/signUrl:
    get:
      consumes:
      - application/json
      description: Return signed iframe URL (base URL only, no hash) for embedding
        Metabase dashboard
      parameters:
      - description: Dashboard ID
        in: query
        name: dashboardId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/gmod.SuccessDataResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/gmod.BadRequestResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/gmod.BaseErrorResponse'
      security:
      - BearerAuth: []
      summary: Generate signed Metabase embed URL
      tags:
      - BI
  /dashboard/blacklist/{id}:
    patch:
      consumes:
      - application/json
      description: Patch blacklist event by id
      parameters:
      - description: Blacklist Event ID
        in: path
        name: id
        required: true
        type: string
      - description: Update payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dashmod.UpdateBlacklistReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Update blacklist event (acknowledged / isDeleted / sop)
      tags:
      - Dashboard
  /devices:
    get:
      consumes:
      - application/json
      description: Get devices with pagination and optional search
      parameters:
      - description: Page number
        in: query
        name: page
        type: integer
      - description: Items per page
        in: query
        name: perPage
        type: integer
      - description: Sort field name
        in: query
        name: sortField
        type: string
      - description: asc or desc
        in: query
        name: sortOrder
        type: string
      - description: Filter by ID
        in: query
        name: id
        type: string
      - description: Filter by code
        in: query
        name: code
        type: integer
      - description: Search by name or code
        in: query
        name: search
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/devmod.DeviceListResponse'
      security:
      - BearerAuth: []
      summary: List all devices
      tags:
      - Devices
    post:
      consumes:
      - application/json
      description: Insert a new camera device to the database
      parameters:
      - description: Device object
        in: body
        name: device
        required: true
        schema:
          $ref: '#/definitions/devmod.DeviceRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/gmod.SuccessMessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/gmod.BadRequestResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/gmod.UnauthorizedResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/gmod.InternalErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a new device
      tags:
      - Devices
  /devices/{id}:
    delete:
      description: Mark a device as deleted by setting state = "delete"
      parameters:
      - description: Device ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/gmod.SuccessMessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/gmod.BadRequestResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/gmod.UnauthorizedResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/gmod.InternalErrorResponse'
      security:
      - BearerAuth: []
      summary: Soft delete a device
      tags:
      - Devices
    get:
      description: Return device detail by ID
      parameters:
      - description: Device ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/devmod.DeviceDetailSwagger'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/gmod.ErrorMessageResponse'
      security:
      - BearerAuth: []
      summary: Get device by ID
      tags:
      - Devices
    patch:
      consumes:
      - application/json
      description: Update fields of a device and set state to "update"
      parameters:
      - description: Device ID
        in: path
        name: id
