      responses:
        "202":
          description: Accepted
          headers:
            Location:
              description: Polling URL e.g. /kwatch/jobs/{jobId}
              type: string
            Retry-After:
              description: Client may poll the Location after N seconds
              type: integer
            X-Trace-Id:
              description: Trace ID for correlating logs/traces
              type: string
          schema:
            $ref: '#/definitions/gmod.AcceptedResponse'
      security:
      - BearerAuth: []
      summary: Sync IBOC images (enqueue tasks)
