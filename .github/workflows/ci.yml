name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - develop

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Run go vet
        run: go vet ./...

      - name: Check gofmt
        run: |
          if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
            echo "Go code is not formatted:"
            gofmt -s -d .
            exit 1
          fi

      - name: Check go mod tidy
        run: |
          cp go.mod go.mod.backup
          cp go.sum go.sum.backup
          go mod tidy
          if diff -u go.mod.backup go.mod || diff -u go.sum.backup go.sum; then
            echo "go mod files need tidying"
            exit 1
          fi
          mv go.mod.backup go.mod
          mv go.sum.backup go.sum

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.out
          flags: unittests
          name: codecov-umbrella

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Build
        run: go build -v -o gateway-api ./...

      - name: Build for Linux
        run: GOOS=linux GOARCH=amd64 go build -v -o gateway-api-linux-amd64 ./...

      - name: Build for macOS
        run: GOOS=darwin GOARCH=amd64 go build -v -o gateway-api-darwin-amd64 ./...
